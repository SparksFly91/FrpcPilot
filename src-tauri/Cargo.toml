[package]
name = "frpcpilot"
version = "0.1.0"
description = "一个基于 Tauri 2 + Vue 3 + TypeScript 的 [frp](https://github.com/fatedier/frp) 可视化客户端，帮助用户快速配置 frpc 版本、服务器与隧道。"
authors = ["SparksFly"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frpcpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["."]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-helper = "0.2.1"

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.4"
tauri-helper = "0.2.1"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "tls-native-tls",
    "chrono",
] }
chrono = { version = "0.4.45", features = ["serde"] }
sysinfo = "0.39"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-autostart = "2"
tauri-plugin-prevent-default = "6.0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
